[package]
name = "custtymize"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A hacker-console TUI for designing your Starship prompt, with a live preview rendered by real starship"
license = "MIT"
repository = "https://github.com/mikemich/custtymize"
homepage = "https://mikemich.github.io/custtymize/"
readme = "README.md"
keywords = ["starship", "prompt", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]
exclude = ["docs/"]

[dependencies]
ansi-to-tui = "8"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0.0"
fastrand = "2.5.0"
ratatui = "0.30"
thiserror = "2.0.21"
toml_edit = "0.25.17"
